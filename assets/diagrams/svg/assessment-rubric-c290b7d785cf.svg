<svg id="my-svg" width="100%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 617.390625 450" style="max-width: 617.391px; background-color: white;" role="graphics-document document" aria-roledescription="pie"><style>#my-svg{font-family:Inter,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:16px;fill:#172433;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#my-svg .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#my-svg .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#my-svg .error-icon{fill:#ffffff;}#my-svg .error-text{fill:#000000;stroke:#000000;}#my-svg .edge-thickness-normal{stroke-width:1px;}#my-svg .edge-thickness-thick{stroke-width:3.5px;}#my-svg .edge-pattern-solid{stroke-dasharray:0;}#my-svg .edge-thickness-invisible{stroke-width:0;fill:none;}#my-svg .edge-pattern-dashed{stroke-dasharray:3;}#my-svg .edge-pattern-dotted{stroke-dasharray:2;}#my-svg .marker{fill:#647b91;stroke:#647b91;}#my-svg .marker.cross{stroke:#647b91;}#my-svg svg{font-family:Inter,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:16px;}#my-svg p{margin:0;}#my-svg .pieCircle{stroke:black;stroke-width:2px;opacity:0.7;}#my-svg .pieCircle.highlighted{scale:1.05;opacity:1;}#my-svg .pieCircle.highlightedOnHover:hover{transition-duration:250ms;scale:1.05;opacity:1;}#my-svg .pieOuterCircle{stroke:black;stroke-width:2px;fill:none;}#my-svg .pieTitleText{text-anchor:middle;font-size:25px;fill:#172433;font-family:Inter,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;}#my-svg .slice{font-family:Inter,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;fill:#172433;font-size:17px;}#my-svg .legend text{fill:#172433;font-family:Inter,PingFang SC,Hiragino Sans GB,Microsoft YaHei,sans-serif;font-size:17px;}#my-svg .node .neo-node{stroke:#6d89a6;}#my-svg [data-look="neo"].node rect,#my-svg [data-look="neo"].cluster rect,#my-svg [data-look="neo"].node polygon{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].swimlane.cluster rect{filter:none;}#my-svg [data-look="neo"].node path{stroke:url(#my-svg-gradient);stroke-width:1px;}#my-svg [data-look="neo"].node .outer-path{filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node .neo-line path{stroke:#6d89a6;filter:none;}#my-svg [data-look="neo"].node circle{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].node circle .state-start{fill:#000000;}#my-svg [data-look="neo"].icon-shape .icon{fill:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg [data-look="neo"].icon-shape .icon-neo path{stroke:url(#my-svg-gradient);filter:drop-shadow( 1px 2px 2px rgba(185,185,185,1));}#my-svg :root{--mermaid-font-family:"trebuchet ms",verdana,arial,sans-serif;}</style><g/><g transform="translate(225,225)"><g><circle cx="0" cy="0" r="186" class="pieOuterCircle"/><path d="M0,-185A185,185,0,0,1,108.74,149.668L0,0Z" fill="#e8f0f8" class="pieCircle"/><path d="M108.74,149.668A185,185,0,0,1,-175.945,-57.168L0,0Z" fill="#f4f7fa" class="pieCircle"/><path d="M-175.945,-57.168A185,185,0,0,1,0,-185L0,0Z" fill="#ffffff" class="pieCircle"/><text transform="translate(131.95909163595255,-42.87610796952395)" class="slice" style="text-anchor: middle;">40%</text><text transform="translate(-81.55520375558064,112.25110796952396)" class="slice" style="text-anchor: middle;">40%</text><text transform="translate(-81.55520375558066,-112.25110796952394)" class="slice" style="text-anchor: middle;">20%</text></g><text x="0" y="-200" class="pieTitleText">课程总评构成</text><g class="legend" transform="translate(216,-33)"><rect width="18" height="18" style="fill: rgb(232, 240, 248); stroke: rgb(232, 240, 