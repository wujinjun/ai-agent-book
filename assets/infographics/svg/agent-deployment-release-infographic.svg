<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536" role="img" aria-labelledby="title desc">
<title id="title">Agent 部署：镜像、拓扑、健康与可恢复发布</title>
<desc id="desc">固定依赖经过多阶段构建形成最小非 root 镜像，配置与 Secret 从外部注入；运行拓扑、健康语义和发布门禁共同形成可恢复交付链。</desc>
<defs><marker id="flat-arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#486985"/></marker></defs>
<rect x="0" y="0" width="1024" height="1536" fill="#F7F4EE"/>
<g font-family="Noto Sans SC, Source Han Sans SC, sans-serif">
<text text-anchor="middle" font-size="29" font-weight="700" fill="#24476B"><tspan x="512" y="48.0">Agent 部署：镜像、拓扑、健康与可恢复发布</tspan></text>
<text text-anchor="middle" font-size="18" font-weight="700" fill="#24476B"><tspan x="86" y="122.0">01  可复现镜像</tspan></text>
<rect x="62" y="158" width="250" height="148" rx="18" fill="#E8EEF4" stroke="#24476B" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#24476B"><tspan x="187" y="203.0">依赖构建</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="187" y="264.0">锁文件 · wheel · 扫描</tspan></text>
<rect x="387" y="158" width="250" height="148" rx="18" fill="#E8F3F0" stroke="#178F82" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#178F82"><tspan x="512" y="203.0">最小运行镜像</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="512" y="264.0">只复制运行产物</tspan></text>
<rect x="712" y="158" width="250" height="148" rx="18" fill="#EFE9F6" stroke="#7656A5" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#7656A5"><tspan x="837" y="203.0">运行身份</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="837" y="264.0">固定 digest · 非 root</tspan></text>
<polyline points="312,232 380,232" fill="none" stroke="#486985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flat-arrow)"/>
<polyline points="637,232 705,232" fill="none" stroke="#486985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flat-arrow)"/>
<text text-anchor="middle" font-size="18" font-weight="700" fill="#24476B"><tspan x="86" y="386.0">02  配置与环境</tspan></text>
<rect x="62" y="420" width="280" height="154" rx="18" fill="#F7E5E4" stroke="#B94A48" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#B94A48"><tspan x="202" y="465.0">Secret 外置</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="202" y="532.0">密钥不进入镜像层</tspan></text>
<rect x="372" y="420" width="590" height="154" rx="18" fill="#E8F3F0" stroke="#178F82" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#178F82"><tspan x="667" y="465.0">同一镜像，不同配置</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="667" y="532.0">开发  →  测试  →  生产</tspan></text>
<polyline points="342,497 365,497" fill="none" stroke="#486985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flat-arrow)"/>
<text text-anchor="middle" font-size="18" font-weight="700" fill="#24476B"><tspan x="86" y="655.0">03  运行拓扑</tspan></text>
<rect x="62" y="694" width="180" height="124" rx="18" fill="#E8EEF4" stroke="#24476B" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#24476B"><tspan x="152" y="739.0">Ingress</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="152" y="776.0">TLS · 限流</tspan></text>
<rect x="298" y="694" width="250" height="124" rx="18" fill="#E8F3F0" stroke="#178F82" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#178F82"><tspan x="423" y="739.0">API × N</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="423" y="776.0">同步与流式入口</tspan></text>
<rect x="604" y="694" width="358" height="124" rx="18" fill="#EFE9F6" stroke="#7656A5" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#7656A5"><tspan x="783" y="739.0">Worker × N</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="783" y="776.0">长任务 · 租约 · 排空</tspan></text>
<polyline points="242,756 291,756" fill="none" stroke="#486985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flat-arrow)"/>
<polyline points="548,756 597,756" fill="none" stroke="#486985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flat-arrow)"/>
<rect x="132" y="872" width="760" height="132" rx="18" fill="#F7EBDD" stroke="#D9782D" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#D9782D"><tspan x="512" y="917.0">有状态基础设施</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="512" y="962.0">PostgreSQL · Redis · Object Store · Model Gateway</tspan></text>
<polyline points="423,818 423,865" fill="none" stroke="#486985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flat-arrow)"/>
<polyline points="783,818 783,865" fill="none" stroke="#486985" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#flat-arrow)"/>
<text text-anchor="middle" font-size="18" font-weight="700" fill="#24476B"><tspan x="86" y="1080.0">04  健康与发布</tspan></text>
<rect x="62" y="1114" width="140" height="130" rx="18" fill="#E8F3F0" stroke="#178F82" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#178F82"><tspan x="132" y="1159.0">Startup</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="132" y="1202.0">初始化完成</tspan></text>
<rect x="252" y="1114" width="140" height="130" rx="18" fill="#E8EEF4" stroke="#24476B" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#24476B"><tspan x="322" y="1159.0">Liveness</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="322" y="1202.0">进程可响应</tspan></text>
<rect x="442" y="1114" width="140" height="130" rx="18" fill="#F7EBDD" stroke="#D9782D" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#D9782D"><tspan x="512" y="1159.0">Readiness</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="512" y="1202.0">必要依赖可用</tspan></text>
<rect x="632" y="1114" width="140" height="130" rx="18" fill="#EFE9F6" stroke="#7656A5" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#7656A5"><tspan x="702" y="1159.0">滚动发布</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="702" y="1202.0">连接排空</tspan></text>
<rect x="822" y="1114" width="140" height="130" rx="18" fill="#F7E5E4" stroke="#B94A48" stroke-width="3"/>
<text text-anchor="middle" font-size="19" font-weight="700" fill="#B94A48"><tspan x="892" y="1159.0">失败恢复</tspan></text>
<text text-anchor="middle" font-size="15" font-weight="500" fill="#203449"><tspan x="892" y="1202.0">降级与回滚</tspan></text>
<rect x="62" y="1325" width="900" height="118" rx="18" fill="#FFFDF8" stroke="#486985" stroke-width="3"/>
<text text-anchor="middle" font-size="20" font-weight="700" fill="#24476B"><tspan x="512" y="1366.0">05  发布证据与门禁</tspan></text>
<text text-anchor="middle" font-size="16" font-weight="700" fill="#486985"><tspan x="512" y="1408.0">Test · Scan · SBOM · Migration · Backup · Trace · Rollback</tspan></text>
</g></svg>
