name: 运行或构建错误
description: 报告可复现的代码、测试、HTML、PDF 或 EPUB 问题。
title: "[Bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: 请先确认没有粘贴 API Key、个人数据或客户材料。
  - type: input
    id: version
    attributes:
      label: 提交或 Release
      placeholder: commit SHA 或 v2026.8.0
    validations: {required: true}
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: Python、操作系统、依赖版本、Pandoc/Chrome/阅读器版本（适用时）。
    validations: {required: true}
  - type: textarea
    id: reproduce
    attributes:
      label: 最小复现
      description: 从干净环境开始的完整命令、输入和实际输出。
    validations: {required: true}
  - type: textarea
    id: expected
    attributes: {label: 预期行为}
    validations: {required: true}
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏日志或截图
      description: 删除密钥、Token、邮箱、客户数据与绝对隐私路径。
  - type: checkboxes
    id: checks
    attributes:
      label: 提交确认
      options:
        - label: 我已在 Python 3.12 或文档明确支持的环境中复现。
          required: true
        - label: 此报告不包含秘密、PII 或未公开漏洞利用细节。
          required: true
