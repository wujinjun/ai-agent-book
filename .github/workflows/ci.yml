name: textbook-ci

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Create the same virtual environment used by project smoke tests
        run: python -m venv .venv
      - name: Install locked dependencies
        run: .venv/bin/pip install -e '.[dev,docs,publish]'
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install diagram and publication tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y pandoc
      - name: Test root suite and all ten project suites
        run: PYTHONPATH=src .venv/bin/pytest tests projects/*/tests -q
      - name: Audit repository hygiene and secrets
        run: |
          .venv/bin/python scripts/audit_repository_hygiene.py
          .venv/bin/python scripts/check_secrets.py
      - name: Lint and type-check
        run: |
          .venv/bin/ruff check .
          .venv/bin/mypy src/ai_agent_book scripts projects/10-enterprise-platform/api.py
      - name: Build documentation and publications
        run: |
          PYTHONPATH=src .venv/bin/python scripts/build_index.py
          git diff --exit-code -- docs/glossary.md docs/references.md docs/book-index.md
          .venv/bin/python scripts/build_diagrams.py --mmdc node_modules/.bin/mmdc
          PYTHONPATH=src .venv/bin/python scripts/audit_visual_review.py
          .venv/bin/python scripts/build_html.py
          .venv/bin/python scripts/build_pandoc.py all
          PYTHONPATH=src .venv/bin/python scripts/audit_publication.py all output
          .venv/bin/python scripts/package_release.py --version ci
