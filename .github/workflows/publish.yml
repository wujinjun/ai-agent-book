name: publish-textbook

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -e '.[dev,docs,publish]'

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install diagram and publication tools
        run: |
          npm ci
          sudo apt-get update
          sudo apt-get install -y pandoc

      - name: Build and audit every publication format
        run: |
          PYTHONPATH=src .venv/bin/python scripts/build_index.py
          git diff --exit-code -- docs/glossary.md docs/references.md docs/book-index.md
          .venv/bin/python scripts/build_diagrams.py --mmdc node_modules/.bin/mmdc
          .venv/bin/python scripts/build_html.py
          .venv/bin/python scripts/build_pandoc.py all
          PYTHONPATH=src .venv/bin/python scripts/audit_publication.py all output
          .venv/bin/python scripts/audit_distribution_assets.py
          .venv/bin/python scripts/audit_repository_hygiene.py
          .venv/bin/python scripts/check_secrets.py
          .venv/bin/python scripts/audit_privacy.py
          .venv/bin/python scripts/audit_final_acceptance.py
          .venv/bin/python scripts/validate_external_evidence.py external-validation/evidence --allow-partial

      - name: Add offline editions to the reading site
        run: |
          mkdir -p output/html/downloads
          cp output/pdf/ai-agent-book-2026.pdf output/html/downloads/
          cp output/epub/ai-agent-book-2026.epub output/html/downloads/

      - name: Package versioned release assets and checksums
        run: .venv/bin/python scripts/package_release.py --version "$GITHUB_REF_NAME"

      - uses: actions/upload-artifact@v4
        with:
          name: ai-agent-book-publication
          path: output
          if-no-files-found: error
          retention-days: 30

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output/html

  deploy-pages:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  final-gate:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Require repository-scope P9 completion for a version tag
        run: |
          python -m venv .venv
          .venv/bin/pip install -e .
          .venv/bin/python scripts/audit_final_acceptance.py \
            --require-repository-complete

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, final-gate]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ai-agent-book-publication
          path: publication

      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" \
              publication/release/* \
              --clobber
          else
            notes_file="publication/release/RELEASE_NOTES-$GITHUB_REF_NAME.md"
            gh release create "$GITHUB_REF_NAME" \
              publication/release/* \
              --title "AI Agent 从零到实战（2026版）$GITHUB_REF_NAME" \
              --notes-file "$notes_file"
          fi
