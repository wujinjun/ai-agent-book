[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-book-token-counter"
version = "0.1.0"
description = "Offline token counting and context budgeting example"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = []

[project.optional-dependencies]
test = ["pytest==8.4.1", "ruff==0.12.2", "mypy==1.16.1"]

[tool.hatch.build.targets.wheel]
packages = ["src/token_counter"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["token_counter"]
mypy_path = "src"
