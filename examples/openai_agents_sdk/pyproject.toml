[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-book-openai-agents-sdk"
version = "0.1.0"
description = "Verified offline OpenAI Agents SDK example"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "openai-agents==0.18.3",
  "httpx[socks]==0.28.1",
]

[project.optional-dependencies]
test = ["pytest==8.4.1", "pytest-asyncio==1.0.0", "ruff==0.12.2", "mypy==2.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/openai_agents_sdk_example"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["openai_agents_sdk_example"]
mypy_path = "src"
