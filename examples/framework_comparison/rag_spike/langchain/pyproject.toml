[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "rag-spike-langchain"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["langchain==1.3.14", "numpy==2.5.1"]

[project.optional-dependencies]
test = ["mypy==2.3.0", "pytest==9.1.1", "ruff==0.16.2"]

[project.scripts]
rag-spike-langchain = "rag_spike_langchain.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rag_spike_langchain"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["rag_spike_langchain"]
