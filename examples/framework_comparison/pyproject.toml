[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "ai-agent-book-framework-comparison"
version = "0.1.0"
description = "Evidence-based, reversible Agent framework comparison"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic==2.13.4"]

[project.optional-dependencies]
test = ["pytest==8.4.1", "ruff==0.12.2", "mypy==2.3.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/framework_comparison"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["framework_comparison"]
mypy_path = "src"
exclude = [
  "src/framework_comparison/candidates/openai_agents_sdk.py",
  "src/framework_comparison/candidates/pydanticai.py",
]

[[tool.mypy.overrides]]
module = [
  "framework_comparison.candidates.openai_agents_sdk",
  "framework_comparison.candidates.pydanticai",
]
ignore_errors = true
