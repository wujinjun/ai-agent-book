      - 第2章 Token 与上下文窗口: part-01-foundations/ch02-token-and-context.md
      - 第3章 Transformer 与 Attention: part-01-foundations/ch03-transformer-attention.md
      - 第4章 LLM 生成机制: part-01-foundations/ch04-generation.md
      - 第5章 Embedding 与语义表示: part-01-foundations/ch05-embedding.md
  - 第二篇 Prompt、工具与 Agent 核心:
