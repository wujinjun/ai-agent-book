site_name: AI Agent 从零到实战（2026版）
site_description: 面向软件工程师的 AI Agent 原理、工程与项目教材
site_author: AI Agent Book contributors
repo_name: ai-agent-book
docs_dir: docs
site_dir: site
strict: true
theme:
  name: material
  custom_dir: overrides
  language: zh
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - content.code.copy
    - search.highlight
    - navigation.top
    - navigation.tracking
    - toc.follow
  palette:
    - scheme: default
      primary: indigo
      accent: blue
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: light blue
extra_css:
  - assets/stylesheets/extra.css
extra_javascript:
  - assets/javascripts/reader.js
markdown_extensions:
  - admonition
  - attr_list
  - footnotes
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
plugins:
  - search
nav:
  - 首页: index.md
  - 前言: preface.md
  - 学习指南: learning-guide.md
  - 第一篇 LLM 与 AI Agent 基础:
