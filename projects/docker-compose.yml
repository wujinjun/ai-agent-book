x-service: &service
  build:
    context: ..
    dockerfile: projects/service.Dockerfile
  restart: unless-stopped
  read_only: true
  tmpfs:
    - /tmp:size=64m,noexec,nosuid
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  deploy:
    resources:
      limits:
        cpus: "1.0"
        memory: 512M

services:
  project-1:
    <<: *service
    build:
      context: ..
      dockerfile: projects/service.Dockerfile
      args: {PROJECT_SLUG: 01-minimal-assistant}
    ports: ["127.0.0.1:8101:8000"]
    volumes: ["project-1-data:/app/data"]
